    progress.addEventListener('input', () => {
      scrubbing = true;
      cancelAnimationFrame(animationFrame);
      animationFrame = 0;
      displayedTime = Number(progress.value) / 1000;
      renderProgress(displayedTime);
      video.currentTime = displayedTime;
      update();
    });
    function finishScrub() { if (!scrubbing) return; scrubbing = false; if (video.paused) stopAnimation(); else startAnimation(); }
    for (const name of ['change', 'pointerup', 'pointercancel', 'blur']) progress.addEventListener(name, finishScrub);
    toggle.addEventListener('click', () => show(toc.dataset.open !== 'true'));
    $('close').addEventListener('click', () => show(false));
    previous.addEventListener('click', () => seek(Math.max(0, indexAt() - 1)));
    next.addEventListener('click', () => seek(Math.min(chapters.length - 1, indexAt() + 1)));
    back.addEventListener('click', () => jumpTo(Math.max(0, video.currentTime - 10)));
    forward.addEventListener('click', () => jumpTo(Math.min(duration() || Infinity, video.currentTime + 10)));
    mute.addEventListener('click', () => {
      setVolumeOpen(true);
      if (video.muted || video.volume === 0) {
        video.volume = video.volume || lastVolume;
        video.muted = false;
      } else {
        lastVolume = video.volume;
        video.muted = true;
      }
    });
    volume.addEventListener('input', () => {
      const level = Number(volume.value) / 100;
      if (level > 0) lastVolume = level;
      video.volume = level;
      video.muted = level === 0;
    });
    volumeControl.addEventListener('pointerenter', () => setVolumeOpen(true));
    volumeControl.addEventListener('pointerleave', () => { if (!volumeControl.contains(document.activeElement)) setVolumeOpen(false); });
    volumeControl.addEventListener('focusin', () => setVolumeOpen(true));
    volumeControl.addEventListener('focusout', (event) => { if (!volumeControl.contains(event.relatedTarget)) setVolumeOpen(false); });
    document.addEventListener('pointerdown', (event) => { if (!volumeControl.contains(event.target)) setVolumeOpen(false); });
    fullscreen.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen?.(); });
    document.addEventListener('fullscreenchange', () => fullscreen.setAttribute('aria-label', document.fullscreenElement ? 'Exit fullscreen' : 'Enter fullscreen'));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && volumeControl.dataset.open === 'true') { mute.focus(); setVolumeOpen(false); event.preventDefault(); return; }
      if (event.key === 'Escape' && toc.dataset.open === 'true') { show(false); return; }
      if (['BUTTON', 'INPUT'].includes(document.activeElement?.tagName)) return;
      if (event.code === 'Space' || event.key.toLowerCase() === 'k') { event.preventDefault(); togglePlayback(); }
      if (event.key === 'ArrowLeft') { event.preventDefault(); jumpTo(Math.max(0, video.currentTime - 10)); }
      if (event.key === 'ArrowRight') { event.preventDefault(); jumpTo(Math.min(duration() || Infinity, video.currentTime + 10)); }
    });
    for (const name of ['timeupdate', 'volumechange']) video.addEventListener(name, update);
    for (const name of ['play', 'playing', 'ratechange']) video.addEventListener(name, startAnimation);
    for (const name of ['pause', 'waiting', 'seeking', 'ended']) video.addEventListener(name, stopAnimation);
    video.addEventListener('seeked', () => { if (video.paused) stopAnimation(); else startAnimation(); });
    video.addEventListener('loadedmetadata', () => { renderMarkers(); update(); });
    video.addEventListener('durationchange', () => { renderMarkers(); update(); });
    update();
  </script>
<script>
const resourceVideo=document.querySelector('video');
function sizeResourceLinks(){const panel=document.getElementById('resource-links');if(!resourceVideo.videoWidth)return;const scale=Math.min(resourceVideo.clientWidth/resourceVideo.videoWidth,resourceVideo.clientHeight/resourceVideo.videoHeight);const width=resourceVideo.videoWidth*scale,height=resourceVideo.videoHeight*scale;Object.assign(panel.style,{left:((resourceVideo.clientWidth-width)/2)+'px',top:((resourceVideo.clientHeight-height)/2)+'px',width:width+'px',height:height+'px',right:'auto',bottom:'auto'})}
function syncResourceLinks(){for(const link of document.querySelectorAll('.resource-hit'))link.style.display=resourceVideo.currentTime>=Number(link.dataset.at)?'block':'none'}
resourceVideo.addEventListener('timeupdate',syncResourceLinks);resourceVideo.addEventListener('seeked',syncResourceLinks);
resourceVideo.addEventListener('loadedmetadata',sizeResourceLinks);window.addEventListener('resize',sizeResourceLinks);sizeResourceLinks();
</script></body>
